[project]
name = "laserwatch"
version = "0.8.5"
description = "Multi-camera UVC laser beam profiler, pointing monitor, and stability logger for Windows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.7,<7",
  "opencv-python>=4.10,<5",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "h5py>=3.11,<4",
  "psutil>=6.0,<8",
  "pyqtgraph>=0.13.7,<0.15",
  "pygrabber==0.2; platform_system == 'Windows'",
  "comtypes>=1.4,<2; platform_system == 'Windows'",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10,<7",
]

[tool.uv]
package = false
