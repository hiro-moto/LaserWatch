name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"
      - ".github/workflows/windows-release.yml"
      - "installer/**"
      - "LaserWatch.spec"
      - "assets/**"
      - "scripts/build_installer.ps1"

permissions:
  contents: write

concurrency:
  group: laserwatch-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        shell: pwsh
        run: |
          python -m pip install --upgrade pip uv

      - name: Read version
        shell: pwsh
        run: |
          $match = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not read version from pyproject.toml" }
          $version = $match.Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building LaserWatch v$version"

      - name: Resolve dependencies
        shell: pwsh
        run: |
          uv sync --extra build
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed" }

      - name: Run regression tests
        shell: pwsh
        run: |
          .\scripts\run_tests.ps1

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $false
          foreach ($candidate in $candidates) {
            if ($candidate -and (Test-Path $candidate)) {
              Write-Host "Inno Setup found: $candidate"
              $found = $true
              break
            }
          }
          if (-not $found) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }

      - name: Build portable application and installer
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1 -SkipTests

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $installer = "installer\output\LaserWatch_Setup_$env:VERSION.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer not found: $installer"
          }

          Copy-Item $installer "release\LaserWatch_Setup_$env:VERSION.exe" -Force
          Copy-Item $installer "release\LaserWatch_Setup_latest.exe" -Force

          $portable = "release\LaserWatch_portable_$env:VERSION.zip"
          Compress-Archive -Path "dist\LaserWatch\*" -DestinationPath $portable -Force
          Copy-Item $portable "release\LaserWatch_portable_latest.zip" -Force

          $files = @(
            "release\LaserWatch_Setup_$env:VERSION.exe",
            "release\LaserWatch_portable_$env:VERSION.zip"
          )

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii "release\SHA256SUMS.txt"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force

          $remoteTag = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($remoteTag) {
            $tagSha = ($remoteTag -split '\s+')[0]
            $headSha = git rev-parse HEAD
            if ($tagSha -ne $headSha) {
              throw "Tag $env:TAG already exists at $tagSha, but HEAD is $headSha. Bump the version in pyproject.toml before publishing a new release."
            }
          } else {
            git tag $env:TAG $env:GITHUB_SHA
            git push origin $env:TAG
          }

          @"
          LaserWatch $env:TAG Windows release.

          Recommended download:
          - LaserWatch_Setup_$env:VERSION.exe — normal Windows installer
          - LaserWatch_portable_$env:VERSION.zip — portable build

          The installer is built automatically on a clean GitHub-hosted Windows runner using PyInstaller and Inno Setup after the regression suite passes.
          "@ | Set-Content -Encoding utf8 release-notes.md

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "LaserWatch $env:TAG" --notes-file release-notes.md --latest
          } else {
            gh release edit $env:TAG --title "LaserWatch $env:TAG" --notes-file release-notes.md --latest
          }

          gh release upload $env:TAG `
            "release\LaserWatch_Setup_$env:VERSION.exe" `
            "release\LaserWatch_Setup_latest.exe" `
            "release\LaserWatch_portable_$env:VERSION.zip" `
            "release\LaserWatch_portable_latest.zip" `
            "release\SHA256SUMS.txt" `
            --clobber

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaserWatch-Windows-${{ env.VERSION }}
          path: release/*
          if-no-files-found: error
