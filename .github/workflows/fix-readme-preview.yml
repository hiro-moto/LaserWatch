name: Fix README icon preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-readme-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode and verify README JPEG
        run: |
          python -m pip install --quiet pillow
          base64 --decode docs/icon_preview.jpg.b64 > docs/icon_preview.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          path = Path('docs/icon_preview.jpg')
          data = path.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '99f3c30559f072f7f3207d8872c774193933d1ffbc8c177a65cc9ea3f6c487f9', digest

          with Image.open(path) as image:
              image.load()
              assert image.format == 'JPEG', image.format
              assert image.size == (320, 320), image.size
              print('JPEG format:', image.format)
              print('JPEG size:', image.size)
              print('JPEG mode:', image.mode)

          print('JPEG bytes:', len(data))
          print('SHA256:', digest)
          PY

      - name: Remove temporary files
        run: |
          rm -f docs/icon_preview.jpg.b64
          rm -f docs/icon_preview_test_tmp.txt

      - name: Commit verified preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          git diff --cached --check
          git status --short
          git commit -m 'Install verified README icon JPEG'
          git push
