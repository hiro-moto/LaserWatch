name: Fix README icon preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-readme-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble and verify JPEG
        run: |
          python -m pip install --quiet pillow
          cat docs/.icon-part-00 docs/.icon-part-01 docs/.icon-part-02 docs/.icon-part-03 docs/.icon-part-04 docs/.icon-part-05 > /tmp/icon.b64
          base64 --decode /tmp/icon.b64 > docs/icon_preview.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          p = Path('docs/icon_preview.jpg')
          data = p.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          expected = '3ab913646bc44653c3b642e809c5a40a4059dc0ff1ef793b0cd46a78b34a8ddb'
          assert digest == expected, (digest, expected)

          with Image.open(p) as image:
              image.load()
              assert image.format == 'JPEG', image.format
              assert image.size == (256, 256), image.size
              assert image.mode == 'RGB', image.mode
              print('Verified JPEG:', image.format, image.size, image.mode)

          print('JPEG bytes:', len(data))
          print('SHA256:', digest)
          PY

      - name: Remove temporary files
        run: |
          rm -f docs/icon_preview.jpg.b64
          rm -f docs/icon_preview_test_tmp.txt
          rm -f docs/.icon-part-*

      - name: Commit verified preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          git diff --cached --check
          git status --short
          git commit -m 'Install verified README icon JPEG'
          git push
