name: Fix README icon preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-readme-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract 256px icon and save verified JPEG
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $iconPath = (Resolve-Path 'assets/icon.ico').Path
          $outPath = Join-Path (Get-Location) 'docs/icon_preview.jpg'

          $icon = [System.Drawing.Icon]::new($iconPath, 256, 256)
          try {
            if ($icon.Width -ne 256 -or $icon.Height -ne 256) {
              throw "ICO decoder returned $($icon.Width)x$($icon.Height), expected 256x256"
            }
            $bitmap = $icon.ToBitmap()
            try {
              $bitmap.Save($outPath, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            }
            finally {
              $bitmap.Dispose()
            }
          }
          finally {
            $icon.Dispose()
          }

          $check = [System.Drawing.Image]::FromFile($outPath)
          try {
            if ($check.Width -ne 256 -or $check.Height -ne 256) {
              throw "JPEG verification failed: $($check.Width)x$($check.Height)"
            }
            Write-Host "Verified JPEG: $($check.Width)x$($check.Height), format=$($check.RawFormat.Guid)"
          }
          finally {
            $check.Dispose()
          }
          Get-FileHash $outPath -Algorithm SHA256

      - name: Remove temporary transfer files
        shell: powershell
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue 'docs/icon_preview.jpg.b64'
          Remove-Item -Force -ErrorAction SilentlyContinue 'docs/icon_preview_test_tmp.txt'
          Remove-Item -Force -ErrorAction SilentlyContinue 'docs/.icon-part-*'

      - name: Commit verified preview
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          git diff --cached --check
          git status --short
          git commit -m 'Install verified README icon JPEG'
          git push
